name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            runtime/python/requirements.txt
            runtime/python/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r runtime/python/requirements.txt
          pip install -r runtime/python/requirements-test.txt

      - name: Run tests with coverage
        run: |
          cd runtime/python
          pytest --cov=. --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: runtime/python/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 runtime/python --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 runtime/python --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            apps/dashboard/package-lock.json
            package-lock.json

      - name: Build dashboard
        run: |
          npm ci
          npm run build

      - name: Archive production build
        run: |
          tar -czf virtual-agency-dashboard-build.tar.gz -C apps/dashboard/dist .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: virtual-agency-dashboard-build.tar.gz

