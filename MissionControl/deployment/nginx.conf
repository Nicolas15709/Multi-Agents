events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/xml+rss application/json;

    # ─── Upstream backends ────────────────────────────────────────────────────
    upstream runtime_api {
        server 127.0.0.1:8787;
    }

    upstream runtime_ws {
        server 127.0.0.1:8765;
    }

    # ─── HTTP → HTTPS redirect (uncomment after adding SSL certs) ────────────
    # server {
    #     listen 80;
    #     server_name tu-dominio.com;
    #     return 301 https://$host$request_uri;
    # }

    server {
        # ── Puertos ──────────────────────────────────────────────────────────
        listen 80;
        # listen 443 ssl;  # Descomentar para SSL

        server_name _;  # Reemplazar con tu dominio: tu-dominio.com

        # ── SSL / Let's Encrypt ───────────────────────────────────────────────
        # Generar certs con: certbot --nginx -d tu-dominio.com
        # ssl_certificate     /etc/letsencrypt/live/tu-dominio.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com/privkey.pem;
        # include             /etc/letsencrypt/options-ssl-nginx.conf;
        # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        # ── CORS global ───────────────────────────────────────────────────────
        # Reemplazar el origen con tu dominio Vercel/Cloudflare real
        set $cors_origin "https://tu-dominio.vercel.app";

        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Preflight OPTIONS
        if ($request_method = OPTIONS) {
            return 204;
        }

        # ── Health check ──────────────────────────────────────────────────────
        location = /health {
            proxy_pass         http://runtime_api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            access_log         off;
        }

        # ── REST API ──────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://runtime_api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeouts generosos para operaciones largas de agentes
            proxy_connect_timeout 10s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;

            # Buffers
            proxy_buffering    on;
            proxy_buffer_size  16k;
            proxy_buffers      8 16k;
        }

        # ── WebSocket ─────────────────────────────────────────────────────────
        location /ws/ {
            proxy_pass         http://runtime_ws/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "Upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Sin timeout para conexiones WebSocket persistentes
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_connect_timeout 10s;
        }
    }
}
