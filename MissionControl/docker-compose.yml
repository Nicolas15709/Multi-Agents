version: '3.8'

services:
  runtime:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virtual-agency-runtime
    restart: unless-stopped
    ports:
      - "8787:8787"
      - "8765:8765"
    env_file:
      - .env
    volumes:
      # Persistencia de datos (SQLite, logs, etc.)
      - ./data:/app/data
    networks:
      - virtual-agency-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  virtual-agency-network:
    driver: bridge
